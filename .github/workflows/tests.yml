name: tests
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pydantic
      - run: python -m unittest tests.test_qloo_client tests.test_qloo_params tests.test_qloo_normalize tests.test_qloo_extractors tests.test_qloo_service -v
