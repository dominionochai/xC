name: tests
permissions:
  contents: write
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      XC_API_TOKEN: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt httpx==0.27.2 pytest
      - name: Publish failure inventory
        if: always()
        continue-on-error: true
        run: |
          python -m pytest tests -q --no-header -p no:cacheprovider 2>&1 | grep -E "^(FAILED|ERROR)" > ci-failures.txt || true
          python -m pytest tests -q --no-header -p no:cacheprovider 2>&1 | tail -n 3 >> ci-failures.txt || true
          git config user.name 'xc-ci'
          git config user.email 'ci@example.invalid'
          git checkout -B ci-report
          git add -f ci-failures.txt
          git commit -m 'ci: failure inventory' || true
          git push -f origin ci-report || true
      - name: P8 focus
        continue-on-error: true
        run: |
          python -m pytest tests/test_p8_api.py -x -q --no-header 2>&1 | tail -n 80
      - run: python -m pytest tests -q --tb=long -p no:cacheprovider
