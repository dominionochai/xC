[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xc"
version = "0.1.0"
description = "Command-line interface and Qloo-backed FastAPI report-analysis service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9.0"]
mcp = ["mcp"]
api = ["fastapi", "uvicorn"]

[project.scripts]
xc = "xc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
