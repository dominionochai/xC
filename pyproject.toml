[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xc"
version = "0.1.0"
description = "Starter scaffold for xC"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
xc = "xc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
